name: CMake

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: libs
        key: ${{ runner.os }}-libs-${{ hashFiles('CMakeLists.txt') }}

    # 新增：手动克隆 JUCE 到 libs/juce 目录
    - name: Clone JUCE
      run: git clone --depth 1 --branch 8.0.12 https://github.com/juce-framework/JUCE.git libs/juce

    - name: Configure CMake
      run: cmake -B build -D CMAKE_BUILD_TYPE=Release -D CMAKE_OSX_ARCHITECTURES="x86_64;arm64"

    - name: Build
      run: cmake --build build --config Release

    - name: Upload Mac Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Mac-AU-and-VST3
        path: |
          build/**/*.component
          build/**/*.vst3

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: ilammy/msvc-dev-cmd@v1
    - uses: actions/checkout@v4

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: libs
        key: ${{ runner.os }}-libs-${{ hashFiles('CMakeLists.txt') }}

    # 新增：手动克隆 JUCE
    - name: Clone JUCE
      run: git clone --depth 1 --branch 8.0.12 https://github.com/juce-framework/JUCE.git libs/juce

    - name: Configure CMake
      run: cmake -B build -D CMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Windows-VST3
        path: build/**/*.vst3
