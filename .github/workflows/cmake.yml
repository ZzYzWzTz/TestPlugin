name: CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # 允许你手动在网页上点按钮触发编译

jobs:
  build-macos:
    runs-on: macos-14 # 使用最新版的 macOS 虚拟机

    steps:
    - uses: actions/checkout@v4

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: libs
        key: ${{ runner.os }}-libs-${{ hashFiles('CMakeLists.txt') }}

    - name: Configure CMake
      # 强制生成通用二进制 (支持 Intel 和 Apple Silicon)
      run: cmake --preset default -D CMAKE_OSX_ARCHITECTURES="x86_64;arm64"

    - name: Build
      run: cmake --build --preset default

    - name: Upload Mac Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Mac-AU-and-VST3
        # 这里抓取编译生成的 AU (.component) 和 VST3
        path: |
          build/AudioPlugin_artefacts/**/*.component
          build/AudioPlugin_artefacts/**/*.vst3

  build-windows:
    runs-on: windows-latest

    steps:
    - uses: ilammy/msvc-dev-cmd@v1

    - uses: actions/checkout@v4

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: libs
        key: ${{ runner.os }}-libs-${{ hashFiles('CMakeLists.txt') }}

    - name: Configure CMake
      run: cmake --preset vs2022

    - name: Build
      run: cmake --build --preset vs2022 --config Release

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Windows-VST3
        path: build/AudioPlugin_artefacts/**/*.vst3
