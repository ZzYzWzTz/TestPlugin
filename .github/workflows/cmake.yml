name: CMake

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
    # 关键修复：加上 submodules: recursive，让云端自动拉取 JUCE
    - uses: actions/checkout@v4
      with:
        submodules: recursive 

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: libs
        key: ${{ runner.os }}-libs-${{ hashFiles('CMakeLists.txt') }}

    - name: Configure CMake
      run: cmake -B build -D CMAKE_BUILD_TYPE=Release -D CMAKE_OSX_ARCHITECTURES="x86_64;arm64"

    - name: Build
      run: cmake --build build --config Release

    - name: Upload Mac Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Mac-AU-and-VST3
        path: |
          build/**/*.component
          build/**/*.vst3

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: ilammy/msvc-dev-cmd@v1
    
    # 关键修复：Windows 也需要拉取子模块
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: libs
        key: ${{ runner.os }}-libs-${{ hashFiles('CMakeLists.txt') }}

    - name: Configure CMake
      run: cmake -B build -D CMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Windows-VST3
        path: build/**/*.vst3
